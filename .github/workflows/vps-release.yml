name: Build VPS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify
        run: |
          corepack pnpm test
          corepack pnpm lint
          corepack pnpm typecheck
      - name: Build standalone release
        env:
          NEXT_PUBLIC_SITE_URL: https://ankaracapilora.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: corepack pnpm build
      - name: Package
        run: |
          mkdir -p release/app/.next
          cp -a .next/standalone/. release/app/
          cp -a .next/static release/app/.next/static
          cp -a public release/app/public
          tar -C release -czf capilora-release.tgz app
      - uses: actions/upload-artifact@v4
        with:
          name: capilora-vps-${{ github.sha }}
          path: capilora-release.tgz
          if-no-files-found: error
          retention-days: 1
